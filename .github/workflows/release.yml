name: Release

# On a tag `v*` (or by hand, without publishing): lint, tests and the .vsix of the extension; with a
# tag, the extension published to the Visual Studio Marketplace (publisher MARCROCK22, with the
# secret VSCE_PAT) and a GitHub release of it whose text is the section of the version in
# CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # package-lock.json is not in the repository (.gitignore).
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Package
        # vsce does not create the directory it writes the package to. The images of the README are
        # those of this commit on GitHub.
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce@4.1.1 package --no-dependencies --skip-license -o dist/ \
            --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.vsix
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        # The tag has to be the version of package.json, and CHANGELOG.md needs a section
        # `## <version>`, up to the next one.
        run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$version" != "$(node -p 'require("./package.json").version')" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version of package.json" >&2
            exit 1
          fi
          awk -v head="## $version" '$0 == head { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      # Before the GitHub release: if the token fails, nothing is half published and the job can
      # simply be re-run. Only this step sees the token.
      - name: Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.1.1 publish --packagePath dist/*.vsix
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --title "env-editor $GITHUB_REF_NAME" --notes-file notes.md
